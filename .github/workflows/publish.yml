name: Publish

on:
  push:
    # Release tags only. The floating `v1` tag that the Action is used through must never
    # reach PyPI, and would fail the version check below anyway.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('src/uv_cache_warden/__init__.py').read()).group(1))")
          test "${tag}" = "${version}" || { echo "tag ${tag} != version ${version}"; exit 1; }

      - run: python -m pip install --disable-pip-version-check build twine
      - run: python -m build
      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/uv-cache-warden
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      # Uses the PYPI_API_TOKEN secret. To move to Trusted Publishing, register this workflow
      # and the `pypi` environment on pypi.org, then drop the `password` line; the id-token
      # permission above is already in place for it.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
