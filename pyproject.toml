[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uv-cache-warden"
version = "1.1.0"
description = "Enforce a size budget on Astral uv's package cache, with LRU eviction through uv itself."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Christo Bosch", email = "cbosch101@gmail.com" }]
keywords = ["uv", "cache", "python", "packaging", "ci"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Archiving :: Packaging",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Booyaka101/uv-cache-warden"
Repository = "https://github.com/Booyaka101/uv-cache-warden"
Issues = "https://github.com/Booyaka101/uv-cache-warden/issues"
Changelog = "https://github.com/Booyaka101/uv-cache-warden/blob/main/CHANGELOG.md"

[project.scripts]
uvcw = "uv_cache_warden.cli:main"
# `uvx uv-cache-warden` looks for an executable named after the package.
uv-cache-warden = "uv_cache_warden.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/uv_cache_warden"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/action.yml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real uv on PATH and network access to PyPI",
]
addopts = "-m 'not integration'"
